name: Fetch Dundee timetable and deploy

on:
  schedule:
    # Since the scrape was parallelised the whole job (all modules + every programme's module
    # associations) runs in ~20 min, so this only needs to land in the early hours UK time.
    # GitHub Actions cron is best-effort and heavily congested at the top of the hour: the old
    # "0 1" slot routinely drifted an hour+, and on 2026-08-27 it was held ~9.75h and didn't run
    # until lunchtime. An odd minute off the hour keeps that delay smaller. 01:23 UTC + the usual
    # ~1h queue still finishes around 03:00, comfortably before morning.
    # Note: Actions cron is always UTC with no DST, so 01:23 here is 01:23 UK in winter (GMT)
    # and 02:23 during British Summer Time. Re-check actual start/duration on the Actions tab
    # occasionally and nudge this if it drifts far from the early morning.
    - cron: "23 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment can run at a time; queue rather than let two overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest timetable data
        env:
          DUNDEE_USERNAME: ${{ secrets.DUNDEE_USERNAME }}
          DUNDEE_PASSWORD: ${{ secrets.DUNDEE_PASSWORD }}
        run: node scripts/fetch-timetable.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
