name: Fetch Dundee timetable and deploy

on:
  schedule:
    # 01:00 UTC start, timed to FINISH around 4am — the full scrape (all modules + every
    # programme's module associations) took 2h51m in the most recent run, so this isn't exact;
    # it'll drift with Dundee's response times night to night. Re-check actual run duration
    # (Actions tab) occasionally and nudge this earlier/later if it drifts far from 4am.
    # Also note: GitHub Actions cron is always UTC with no DST adjustment, so "1am" here is
    # really 1am UK time in winter (GMT) but 2am during British Summer Time.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment can run at a time; queue rather than let two overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest timetable data
        env:
          DUNDEE_USERNAME: ${{ secrets.DUNDEE_USERNAME }}
          DUNDEE_PASSWORD: ${{ secrets.DUNDEE_PASSWORD }}
        run: node scripts/fetch-timetable.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
