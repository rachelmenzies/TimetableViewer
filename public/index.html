<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dundee Timetable Clash Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>Timetable Checker</h1>
          <p class="last-updated" id="lastUpdated" hidden></p>
        </div>
        <div class="topbar-actions">
          <button class="secondary-button" id="fetchDataButton" type="button" title="Fetch every module and the programme list from Dundee">
            Fetch Data
          </button>
          <button class="secondary-button" id="uploadButton" type="button" title="Upload a saved Dundee timetable HTML page">
            Upload
          </button>
          <input id="uploadInput" type="file" accept=".html,.htm,text/html" hidden />
          <button class="secondary-button" id="clearTimetableButton" type="button" title="Remove all modules from the timetable (keeps loaded data)">
            Clear timetable
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="schedule-area" aria-label="Selected timetable">
          <div class="programme-bar">
            <label class="programme-search">
              <span>Programme</span>
              <input
                id="programmeSearch"
                type="text"
                placeholder="Search Programme"
                autocomplete="off"
                disabled
              />
              <ul class="suggestion-list" id="programmeSuggestions" hidden></ul>
            </label>
          </div>

          <div class="summary-band">
            <div>
              <span class="metric-value" id="selectedCount">0</span>
              <span class="metric-label">selected</span>
            </div>
            <div>
              <span class="metric-value" id="classCount">0</span>
              <span class="metric-label">classes</span>
            </div>
            <div class="clash-metric" id="clashMetric">
              <span class="metric-value" id="clashCount">0</span>
              <span class="metric-label">clashes</span>
            </div>
          </div>

          <div class="clash-list" id="clashList" hidden></div>

          <div class="semester-groups" id="semesterGroups"></div>
        </section>

        <aside class="module-panel" aria-label="Modules">
          <div class="module-panel-header">
            <div class="module-actions">
              <button class="icon-button" id="selectAllButton" type="button" title="Add all modules to the timetable">All</button>
              <button class="icon-button" id="clearButton" type="button" title="Remove all modules from the timetable">None</button>
            </div>
          </div>

          <label class="search-box">
            <span>Modules</span>
            <input id="moduleSearch" type="search" placeholder="Code or name" autocomplete="off" />
            <ul class="suggestion-list" id="moduleSuggestions" hidden></ul>
          </label>

          <div class="module-list" id="moduleList"></div>
        </aside>
      </main>

      <div class="modal-backdrop" id="dundeeModal" hidden>
        <section class="login-modal" role="dialog" aria-modal="true" aria-labelledby="dundeeLoginTitle">
          <div class="modal-header">
            <h2 id="dundeeLoginTitle">Fetch Data</h2>
            <button class="icon-button" id="closeDundeeModal" type="button" title="Close">Close</button>
          </div>
          <form id="dundeeLoginForm">
            <label>
              Username
              <input id="dundeeUsername" name="username" autocomplete="username" placeholder="Student ID or DUNDEE\\username" required />
            </label>
            <label>
              Password
              <div class="password-field">
                <input id="dundeePassword" name="password" type="password" autocomplete="current-password" required />
                <button class="icon-button" id="togglePassword" type="button" title="Show password">Show</button>
              </div>
            </label>
            <label>
              Source URL
              <input
                id="dundeeUrl"
                name="url"
                type="url"
                value="https://timetable.dundee.ac.uk/Scientia/SWS/Dundee2627/"
                required
              />
            </label>
            <label>
              Limit modules (optional, for testing)
              <input id="dundeeLimit" name="limit" type="number" min="1" step="1" placeholder="e.g. 20" />
            </label>
            <label class="checkbox-field">
              <input id="dundeeDebug" name="debug" type="checkbox" />
              Save raw HTML for inspection (debug-output/)
            </label>
            <div class="credential-note">
              Credentials are sent only to this local app and are not saved. Bare usernames are tried as DUNDEE\\username.
              Pulls every module and the programme list, so this can take a while.
            </div>
            <div class="import-actions">
              <button class="primary-button" type="submit">Fetch Data</button>
              <button class="secondary-button" id="cancelDundeeLogin" type="button">Cancel</button>
            </div>
          </form>
        </section>
      </div>

      <div class="modal-backdrop" id="progressModal" hidden>
        <section class="login-modal progress-modal" role="dialog" aria-modal="true" aria-labelledby="progressTitle">
          <div class="modal-header">
            <h2 id="progressTitle">Fetching Data</h2>
          </div>
          <div class="progress-bar" id="progressBar"><div class="progress-bar-fill" id="progressBarFill"></div></div>
          <ul class="progress-log" id="progressLog"></ul>
        </section>
      </div>
    </div>

    <div class="event-tooltip" id="eventTooltip" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
